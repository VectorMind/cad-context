[project]
name = "cad-context"
version = "0.1.0"
description = "Project-oriented programmatic CAD workbench built around build123d."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy",
    "pydantic>=2",
    "pyyaml",
    "rich",
    "typer",
]

[project.scripts]
cadctx = "cad_context.cli:main"

[project.optional-dependencies]
build123d = ["build123d"]
openscad = ["solidpython2"]
mesh = ["trimesh", "manifold3d"]
# No `airfoil` extra: the NACA family is numpy, which is a core dependency, and
# its 2D exports ride on `vector2d` / its lofts on the kernel extras. The empty
# placeholder that used to sit here reserved an aerosandbox dependency that
# OP-302 rejected outright.
vector2d = ["ezdxf", "drawsvg", "shapely"]
default = ["cad-context[build123d,mesh,vector2d]"]
all = ["cad-context[default,openscad]"]

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.uv]
default-groups = ["dev"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cad_context"]

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
