[project]
name = "cad-context"
version = "0.1.0"
description = "Project-oriented programmatic CAD workbench built around build123d."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "build123d",
    "drawsvg",
    "ezdxf",
    "manifold3d",
    "numpy",
    "pydantic>=2",
    "pyyaml",
    "rich",
    "shapely",
    "trimesh",
    "typer",
]

[project.scripts]
cadcon = "cad_context.cli:main"

[project.optional-dependencies]
# Compatibility names: the maintained geometry stack is installed by default.
build123d = []
openscad = ["solidpython2"]
mesh = []
# No `airfoil` extra: the NACA family is numpy, which is a core dependency, and
# its 2D exports and lofts use the required geometry stack. The empty
# placeholder that used to sit here reserved an aerosandbox dependency that
# OP-302 rejected outright.
vector2d = []
default = []
all = ["cad-context[openscad]"]

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.uv]
default-groups = ["dev"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cad_context"]

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
