version: 1
default: animal-puzzle
roots:
  models:
    env: CADCON_PROJECTS_ROOT
    candidates:
    - ~/My Drive/Projects/3d-models
    - ~/My Drive/Flatshare/3D Models Shared/projects
  shared-models:
    env: CADCON_SHARED_PROJECTS_ROOT
    candidates:
    - ~/My Drive/Flatshare/3D Models Shared/projects
  model-sources:
    env: CADCON_SOURCES_ROOT
    candidates:
    - ../model-projects
projects:
  animal-puzzle:
    root: model-sources
    path: animal-puzzle
    publication:
      root: shared-models
      path: animal-puzzle
  airfoil-wing:
    root: models
    path: airfoil-wing
  reference-parts:
    root: models
    path: reference-parts
